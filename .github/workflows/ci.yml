name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test · release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: release build
        run: cargo build --release

  coverage:
    name: llvm-cov (pure modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2.87.13
        with:
          tool: cargo-llvm-cov

      - name: pure-module coverage
        run: ./scripts/coverage.sh lcov

      - name: upload lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-info
          path: target/llvm-cov/lcov.info

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Advisories hard-fail (PLAN M4.5-c). No continue-on-error.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # cargo-mutants is local-only (slow). Run via ./scripts/mutants.sh.
