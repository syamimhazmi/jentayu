# cargo-deny — M4.5-c supply-chain policy
# Run: cargo deny check
# CI: EmbarkStudios/cargo-deny-action (advisories hard-fail)

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
# vulnerability / unmaintained / notice use cargo-deny defaults (deny/warn).
# Do not ignore advisories without crate + reason + revisit date.

[licenses]
# MIT/Apache/BSD-ish + licenses already present in the resolved tree.
# Dual-license OR expressions pass when any allowed license matches.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "BSL-1.0",
    "MPL-2.0",
    "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
